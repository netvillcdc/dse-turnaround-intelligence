name: LankaBangla Daily Update

on:
  schedule:
    - cron: "30 12 * * 0-4"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python collector.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stocks.json data/history.json
          git diff --cached --quiet || git commit -m "Auto update LankaBangla data"
          git push
